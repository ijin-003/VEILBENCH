name: Approved internal UI checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/approved-internal-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Lint all frontend code except unchanged legacy signup
        run: npx eslint . --ignore-pattern src/app/AuthGateway.tsx
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Chromium for responsive browser checks
        run: npx playwright install --with-deps chromium
      - name: Exercise public and authenticated flows across viewports
        run: npm run test:e2e
