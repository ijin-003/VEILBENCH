name: Backend security regression

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "alembic.ini"
      - "pyproject.toml"
      - ".github/workflows/backend-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python source
        run: python -m compileall -q backend scripts
      - name: Run full backend tests
        run: python -m pytest backend/tests -o addopts="--asyncio-mode=auto" -q
