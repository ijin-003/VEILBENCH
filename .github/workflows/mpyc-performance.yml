name: Phase C MPC performance baseline

on:
  pull_request:
    paths:
      - "scripts/benchmark_mpyc_phase_c.py"
      - ".github/workflows/mpyc-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run real three-process MPyC benchmark
        run: python -m scripts.benchmark_mpyc_phase_c --runs 6 --warmup 1
      - name: Run existing disconnected-party safety regression
        run: python -m pytest backend/tests/test_mpyc_protocol.py -k disconnected_party_handling -q
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilbench-mpyc-phase-c-metrics
          path: artifacts/mpyc-benchmark.json
          if-no-files-found: warn
